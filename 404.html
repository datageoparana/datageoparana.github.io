<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Pagina nao encontrada — Datageo Parana</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f766e'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='16' fill='white'%3EDG%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html.gate-pre-lock body { visibility: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .container { text-align: center; max-width: 480px; padding: 2rem; }
    .container h1 { font-size: 4rem; margin: 0; color: #0f766e; }
    .container p { font-size: 1.1rem; line-height: 1.6; }
    .container a { color: #0f766e; font-weight: 600; text-decoration: none; }
    .container a:hover { text-decoration: underline; }
  </style>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dg_auth_session');
        var ok = false;
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.email && s.expiresAt && new Date(s.expiresAt).getTime() > Date.now()) ok = true;
        }
        if (!ok) document.documentElement.classList.add('gate-pre-lock');
      } catch (e) {
        document.documentElement.classList.add('gate-pre-lock');
      }
    })();
    window.TRACKING_CONFIG = window.TRACKING_CONFIG || {
      url: 'https://script.google.com/macros/s/AKfycbwdSLK3K9_D39sc0UfzYZIM1QEMLxMUudSneAELoqcJjM5ExTSq7ZmMilNzYDx5QK5iMA/exec'
    };
  </script>
  <script src="auth.js" defer></script>
  <script>
    document.addEventListener('dg:auth:unlocked', function () { document.documentElement.classList.remove('gate-pre-lock'); });
    document.addEventListener('dg:auth:ready', function () { document.documentElement.classList.remove('gate-pre-lock'); });
  </script>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Pagina nao encontrada.</p>
    <p><a href="/">Voltar para a pagina inicial</a></p>
  </div>
</body>
</html>
